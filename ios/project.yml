name: dAIly
options:
  bundleIdPrefix: com.jacobmarriott
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Debug.xcconfig
  Release: Release.xcconfig
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    majorVersion: 2.13.0
targets:
  dAIly:
    type: application
    platform: iOS
    sources: [dAIly]
    dependencies:
      - package: LiveKit
        product: LiveKit
    info:
      path: dAIly/Info.plist
      properties:
        CFBundleDisplayName: dAIly
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "dAIly uses your microphone for the voice briefing."
        NSLocalNetworkUsageDescription: "dAIly uses your local network to establish a fast, low-latency connection for real-time voice conversations."
        DailyBackendBaseURL: "$(DAILY_BACKEND_BASE_URL)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobmarriott.daily
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: dAIly/dAIly.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  dAIlyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [dAIlyTests]
    dependencies:
      - target: dAIly
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
