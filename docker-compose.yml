services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: daily
      POSTGRES_PASSWORD: daily_dev
      POSTGRES_DB: daily
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:v1.11.0
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
    environment:
      - "LIVEKIT_KEYS=devkey: secret"

volumes:
  pgdata:
