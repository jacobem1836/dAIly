services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: daily
      # Dev-only default password. Override in .env for anything beyond a
      # throwaway local instance — do not reuse this value anywhere else.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daily_dev}
      POSTGRES_DB: daily
    ports:
      # Bind to loopback only — do not expose Postgres on all interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daily -d daily"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-daily_dev_redis}"]
    ports:
      # Bind to loopback only — do not expose Redis on all interfaces.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-daily_dev_redis} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  livekit:
    image: livekit/livekit-server:v1.11.0
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Dev-only override: hot reload for local iteration. Production uses the
    # image's built-in CMD (no --reload) — see Dockerfile.api.
    command: ["uv", "run", "uvicorn", "daily.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "src"]
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://daily:${POSTGRES_PASSWORD:-daily_dev}@postgres:5432/daily
      DATABASE_URL_PSYCOPG: postgresql://daily:${POSTGRES_PASSWORD:-daily_dev}@postgres:5432/daily
      REDIS_URL: redis://:${REDIS_PASSWORD:-daily_dev_redis}@redis:6379/0
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["uv", "run", "python", "-m", "daily.worker", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret12345678901234567890123
      DATABASE_URL: postgresql+asyncpg://daily:${POSTGRES_PASSWORD:-daily_dev}@postgres:5432/daily
      DATABASE_URL_PSYCOPG: postgresql://daily:${POSTGRES_PASSWORD:-daily_dev}@postgres:5432/daily
      REDIS_URL: redis://:${REDIS_PASSWORD:-daily_dev_redis}@redis:6379/0
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'daily.worker' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  pgdata:
