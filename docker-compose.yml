services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: daily
      POSTGRES_PASSWORD: daily_dev
      POSTGRES_DB: daily
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:v1.11.0
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://daily:daily_dev@postgres:5432/daily
      DATABASE_URL_PSYCOPG: postgresql://daily:daily_dev@postgres:5432/daily
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["uv", "run", "python", "-m", "daily.worker", "dev"]
    depends_on:
      - postgres
      - redis
      - livekit
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret12345678901234567890123
      DATABASE_URL: postgresql+asyncpg://daily:daily_dev@postgres:5432/daily
      DATABASE_URL_PSYCOPG: postgresql://daily:daily_dev@postgres:5432/daily
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src

volumes:
  pgdata:
